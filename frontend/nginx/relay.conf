# Relay CRM edge (behind Cloudflare Tunnel). Only this container is reachable by cloudflared;
# PostgreSQL/Redis/Celery/WPPConnect have no published ports.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# cloudflared forwards the visitor's scheme; fall back to the local scheme for direct tests.
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

upstream relay_backend { server backend:8000; keepalive 16; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 300k;          # Django rejects bodies over 256 KiB itself
    root /usr/share/nginx/html;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Internal-only endpoints: WPPConnect calls the backend directly on the Docker network.
    location ^~ /internal/ { return 404; }
    location ^~ /admin/ { return 404; }
    location = /api/health/infrastructure/ { return 404; }

    # Attachment uploads are the only large request bodies (Django enforces ATTACHMENT_MAX_BYTES).
    location ~ ^/api/workspaces/[0-9a-f-]+/conversations/[0-9a-f-]+/attachments/$ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 11m;
        proxy_request_buffering on;
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        # Never let any cache store private API responses (Django also sends no-store, private).
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /ws/ {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 3600s;           # long-lived realtime sockets (server heartbeats every 20 s)
        proxy_send_timeout 3600s;
    }

    # Embeddable scripts for customer websites: short public cache, loadable cross-site.
    location ~ ^/(widget|whatsapp-link)\.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # Fingerprinted Vite assets are immutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The admin single-page app. The CSP allows only same-origin code and realtime sockets.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

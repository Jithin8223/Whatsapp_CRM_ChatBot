# Production override — use together with the base file:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Local development is unchanged: `docker compose up` ignores this file.
#
# Topology: Internet -> Cloudflare (DNS, TLS, WAF) -> cloudflared tunnel (outbound only)
#           -> web (nginx: SPA + /api + /ws) -> backend (Daphne) ; celery ; redis ; wppconnect
#           -> Supabase PostgreSQL over TLS (DATABASE_URL).
# No service publishes a host port. See docs/PRODUCTION.md.

x-prod-env: &prod-env
  DJANGO_DEBUG: 'false'
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Supabase) in .env.production}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
  DB_POOL_MODE: ${DB_POOL_MODE:-session}
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS, e.g. crm.example.com,backend,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS, e.g. https://crm.example.com}
  TRUST_PROXY_HTTPS_HEADER: 'true'
  TRUSTED_CLIENT_IP_HEADER: CF-Connecting-IP
  TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
  ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-local}
  ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-relay-attachments}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

services:
  # Supabase replaces the local database in production; start it only with --profile local-db
  # (e.g. a staging host that deliberately keeps its own database).
  postgres:
    profiles: [local-db]

  migrate:
    environment: *prod-env
    volumes: !reset []
    depends_on: !override
      redis: {condition: service_healthy}

  backend:
    environment: *prod-env
    # No source mount in production; only the private attachment volume (unused when
    # ATTACHMENT_STORAGE=supabase).
    volumes: !override [attachments:/data/attachments]
    ports: !reset []
    depends_on: !override
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  celery:
    environment: *prod-env
    volumes: !override [attachments:/data/attachments]
    depends_on: !override
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SHOW_WHATSAPP_UI: ${VITE_SHOW_WHATSAPP_UI:-true}
        VITE_SHOW_WEBSITE_CHAT_UI: ${VITE_SHOW_WEBSITE_CHAT_UI:-true}
    image: relay-crm-web:prod
    ports: !reset []
    volumes: !reset []
    environment: !reset {}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/nginx-health]
      interval: 15s
      timeout: 5s
      retries: 10

  cloudflared:
    # Outbound-only tunnel: no inbound firewall ports are needed on the host.
    image: cloudflare/cloudflared:2025.8.0
    command: [tunnel, --no-autoupdate, run]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend: {condition: service_healthy}
    networks: [crm]

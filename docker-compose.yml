name: whatsapp-ai-crm

x-backend: &backend
  build: ./backend
  image: whatsapp-ai-crm-backend:phase1
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/Initialize.ps1}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
    POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    POSTGRES_USER: ${POSTGRES_USER:-crm}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    WPPCONNECT_URL: http://wppconnect:21465
    WPPCONNECT_ENABLED: ${WPPCONNECT_ENABLED:-false}
    CRM_AI_API_KEY: ${CRM_AI_API_KEY:-}
    CRM_AI_MODEL: ${CRM_AI_MODEL:-}
    WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:?Set WPPCONNECT_SECRET_KEY}
    WPPCONNECT_WEBHOOK_SECRET: ${WPPCONNECT_WEBHOOK_SECRET:?Run scripts/Initialize.ps1 for Phase 2}
  volumes:
    - ./backend:/app
    # Private customer attachments (never served directly; streamed by authenticated API).
    - attachments:/data/attachments
  networks: [crm]

services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [crm]

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [crm]

  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  backend:
    <<: *backend
    command: [daphne, -b, 0.0.0.0, -p, '8000', config.asgi:application]
    restart: unless-stopped
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery:
    <<: *backend
    command: [celery, -A, config, worker, --beat, --schedule=/tmp/celerybeat-schedule, --loglevel=WARNING, '--hostname=worker@%h', --concurrency=2]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  wppconnect:
    # Pre-incident release; immutable digest, not latest. See docs/SECURITY.md.
    image: wppconnect/wppconnect-server:2.10.81@sha256:7c882ee934a5663a107b5f5a0382bfd8b1fb95150cd21ab35cd8ff9cea70d1f8
    restart: unless-stopped
    entrypoint: [node, /opt/crm/privacy.js]
    # Node as PID 1 never reaped crashed Chromium processes (zombies accumulated).
    init: true
    shm_size: 1gb
    environment:
      PORT: '21465'
      # Time allowed to scan a pairing QR before the attempt closes (ms, minimum 60000).
      WPP_AUTO_CLOSE_MS: ${WPP_AUTO_CLOSE_MS:-180000}
      HOST: http://wppconnect
      SECRET_KEY: ${WPPCONNECT_SECRET_KEY:?Set WPPCONNECT_SECRET_KEY}
      MANAGER_ENABLED: 'false'
      TOKEN_STORE_TYPE: file
      CUSTOM_USER_DATA_DIR: /usr/src/wpp-server/userDataDir/
      WEBHOOK_URL: http://wppconnect:${WPPCONNECT_WEBHOOK_SECRET:?Run scripts/Initialize.ps1}@backend:8000/internal/wppconnect/
      WEBHOOK_AUTO_DOWNLOAD_MAX_SIZE: '65536'
    volumes:
      - ./infrastructure/wppconnect/privacy.js:/opt/crm/privacy.js:ro
      - wpp_tokens:/usr/src/wpp-server/tokens
      - wpp_userdata:/usr/src/wpp-server/userDataDir
      - wpp_uploads:/usr/src/wpp-server/uploads
      - wpp_images:/usr/src/wpp-server/WhatsAppImages
      - wpp_logs:/usr/src/wpp-server/log
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:21465/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [crm]

  frontend:
    build: ./frontend
    image: whatsapp-ai-crm-frontend:phase1
    restart: unless-stopped
    ports: ['127.0.0.1:${FRONTEND_PORT:-5173}:5173']
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_SHOW_WHATSAPP_UI: ${VITE_SHOW_WHATSAPP_UI:-true}
      VITE_SHOW_WEBSITE_CHAT_UI: ${VITE_SHOW_WEBSITE_CHAT_UI:-true}
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [crm]

networks:
  crm:
    driver: bridge
volumes:
  attachments:
  postgres_data:
  redis_data:
  frontend_modules:
  wpp_tokens:
  wpp_userdata:
  wpp_uploads:
  wpp_images:
  wpp_logs:
